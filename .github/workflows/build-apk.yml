name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Opsional: buat GitHub Release dengan tag ini (misal v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Pengingat Shalat & Imsak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for signing
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest

      - name: Build installable Debug APK
        run: gradle :app:assembleDebug

      - name: Prepare named APK output
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Pengingat-Shalat-Imsak.apk

      - name: Build signed Release APK (if keystore secrets are configured)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk release-output/Pengingat-Shalat-Imsak-release.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pengingat-Shalat-Imsak-APK
          path: release-output/*.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ inputs.release_tag }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-output/*.apk --clobber
          else
            gh release create "$TAG_NAME" release-output/*.apk \
              --title "Pengingat Shalat & Imsak $TAG_NAME" \
              --notes "Unduh file **.apk** di bawah ini langsung di perangkat Android Anda, lalu buka untuk memasang aplikasi **Pengingat Shalat & Imsak** (100% offline, standar Kemenag RI)."
          fi
